name: Deploy to King's Landing
description: Deploy a static site to King's Landing

inputs:
  project:
    description: Project name on King's Landing
    required: true
  directory:
    description: Directory to deploy
    required: true
  deploy-key:
    description: Deploy key for authentication
    required: true
  api-url:
    description: API URL override
    required: false

outputs:
  deployment-id:
    description: The deployment ID
    value: ${{ steps.deploy.outputs.deployment-id }}
  project-url:
    description: The live project URL
    value: ${{ steps.deploy.outputs.project-url }}

runs:
  using: composite
  steps:
    - name: Deploy
      id: deploy
      shell: bash
      env:
        KL_DEPLOY_KEY: ${{ inputs.deploy-key }}
        KL_API_URL: ${{ inputs.api-url }}
        KL_DIRECTORY: ${{ inputs.directory }}
        KL_PROJECT: ${{ inputs.project }}
      run: |
        OUTPUT=$(npx --yes @kingslanding/cli@^1 deploy "$KL_DIRECTORY" \
          --project "$KL_PROJECT" \
          --json 2>/dev/null)
        DEPLOYMENT_ID=$(printf '%s' "$OUTPUT" | jq -r '.deployment_id')
        PROJECT_URL=$(printf '%s' "$OUTPUT" | jq -r '.project_url')
        {
          echo "deployment-id=$DEPLOYMENT_ID"
          echo "project-url=$PROJECT_URL"
        } >> "$GITHUB_OUTPUT"
        echo "Deployed to $PROJECT_URL"
        {
          echo "### King's Landing deploy"
          echo ""
          echo "- **URL:** [$PROJECT_URL]($PROJECT_URL)"
          echo "- **Deployment:** \`$DEPLOYMENT_ID\`"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::notice title=Deployed::$PROJECT_URL"
